[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9.2"
argon2 = "0.5.3"
lazy_static = "1.5.0"

[[bin]]
name = "taskr-app"
path = "backend/main.rs"
